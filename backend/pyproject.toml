[project]
name = "fastapi-orm-alembic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GbrNovo", email = "gabrielnovobrandao@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
fastapi-orm-alembic = "fastapi_orm_alembic:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false