services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      POSTGRES_DB: escola
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escola -d escola"]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      user: escola
      senha: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      host: banco
      porta: "5432"
      banco: escola
    ports:
      - "8000:8000"
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dados_postgres:
